# Reference: https://qlty.sh/d/qlty-toml
#
# Code-quality configuration for both the Qlty CLI and Qlty Cloud. Lint and
# format rules come from the shared sinemacula/coding-standards source; this
# file wires that source in and selects the plugins relevant to a PHP
# repository.
config_version = "0"

exclude_patterns = [
    "*_min.*",
    "*-min.*",
    "*.min.*",
    "**/build/**",
    "**/cache/**",
    "**/coverage/**",
    "**/dist/**",
    "**/node_modules/**",
    "**/vendor/**",
    ".claude/**",
    ".qlty/configs/**",
    ".sinemacula/**",
]

test_patterns = [
    "**/test/**",
    "**/tests/**",
    "**/spec/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/test_*.*",
    "**/spec_*.*",
]

# The lint tooling only, not the library's supported range, which composer.json
# keeps at 8.3. php-cs-fixer's symfony/console cannot be parsed by an 8.3 runner.
[runtimes.enabled]
php = "8.4"

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[source]]
name = "sinemacula"
repository = "https://github.com/sinemacula/coding-standards"
tag = "v1.23.0"

[[plugin]]
name = "actionlint"

[[plugin]]
name = "editorconfig-checker"

[[plugin]]
name = "markdownlint"
mode = "comment"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "php-codesniffer"
version = "4.0.4"
mode = "comment"
package_file = "composer.json"
package_filters = ["slevomat", "dealerdirect", "sinemacula"]

# phpcs 4.x returns exit code 3 when it finds issues; qlty's default
# success_codes ([0, 1]) would treat that as a plugin failure and discard the
# findings. This override accepts the 4.x codes. It lives here, not in the
# shared source.toml, because a drivers table there breaks the source's
# exported_config_paths. Only required while on phpcs 4.x.
[plugins.definitions.php-codesniffer.drivers.lint]
success_codes = [0, 1, 2, 3]

# Held at the version the shared standard requires. Its symfony/console is on
# the 8.x line, which needs PHP 8.4.1 and uses 8.4-only syntax, which is why the
# lint runtime above is 8.4 while the library itself still targets 8.3.
[[plugin]]
name = "php-cs-fixer"
package_file = "composer.json"
package_filters = ["sinemacula"]
version = "3.95.25"

[[plugin]]
name = "phpstan"
version = "2.1.46"
package_file = "composer.json"

[[plugin]]
name = "radarlint-php"
mode = "comment"

[[plugin]]
name = "trivy"
drivers = [
    "config",
    "fs-vuln",
]

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "yamllint"

# Skip radarlint smell analysis on the test tree - reused fixture literals and
# multi-branch data providers trip duplication/return-count rules without value.
[[exclude]]
plugins = ["radarlint-php"]
file_patterns = ["tests/**"]
