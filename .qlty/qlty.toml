# Reference: https://qlty.sh/d/qlty-toml
#
# Rules, plugins and plugin versions come from the sinemacula/coding-standards
# source below.
config_version = "0"

exclude_patterns = [
    "*_min.*",
    "*-min.*",
    "*.min.*",
    "**/build/**",
    "**/cache/**",
    "**/coverage/**",
    "**/dist/**",
    "**/node_modules/**",
    "**/vendor/**",
    ".claude/**",
    ".qlty/configs/**",
    ".sinemacula/**",
]

test_patterns = [
    "**/test/**",
    "**/tests/**",
    "**/spec/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/test_*.*",
    "**/spec_*.*",
]

[[source]]
name = "default"
default = true

[[source]]
name = "sinemacula"
repository = "https://github.com/sinemacula/coding-standards"
tag = "v1.30.0"

[[plugin]]
name = "php-codesniffer"
package_file = "composer.json"
package_filters = ["slevomat", "dealerdirect", "sinemacula"]

# The fixer config needs the standards package. No package_file here, because
# setting one silently drops extra_packages.
[[plugin]]
name = "php-cs-fixer"
extra_packages = ["sinemacula/coding-standards@1.30.0"]

[[plugin]]
name = "phpstan"
package_file = "composer.json"
