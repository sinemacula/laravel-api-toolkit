# release-please keeps a Release PR open on master; merging it tags the release
# and publishes a GitHub Release, which Packagist picks up from the tag.
name: Release

on:
    push:
        branches: [ master ]

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write

jobs:
    release:
        uses: sinemacula/.github/.github/workflows/release.yml@v2.0.0
        secrets: inherit
        with:
            # The org tag ruleset only accepts tags created with the GitHub App token
            use-app-token: true
