name: Quality Gates

on:
    push:
        branches: [ master ]
    pull_request:
        types: [ opened, synchronize, reopened, ready_for_review ]
    schedule:
        -   cron: 0 7 * * 1
    workflow_dispatch:

# Keyed by event so a merge to master cannot cancel a scheduled or manual run
concurrency:
    group: quality-gates-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
    cancel-in-progress: true

permissions:
    contents: read

defaults:
    run:
        shell: bash

jobs:
    mutation:
        if: ${{ github.event_name != 'schedule' }}
        name: Mutation / PHP 8.3
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false
                    fetch-depth: 0

            -   name: Fetch base branch for the diff
                run: git fetch --no-tags origin master

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v3.2.0
                with:
                    php-version: 8.3
                    coverage: pcov

            # On push, origin/master is the pushed commit, so diff against the commit master moved from
            -   name: Scoped mutation gate
                env:
                    BEFORE: ${{ github.event.before }}
                run: |
                    base=origin/master
                    if [ "$GITHUB_EVENT_NAME" = push ]; then
                        if ! git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
                            echo "::error::master did not move forward from ${BEFORE}, so the changed lines are unknown; run the full mutation suite."
                            exit 1
                        fi
                        base=$BEFORE
                    fi
                    composer test:mutation -- --git-diff-base="$base"

    mutation-full:
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        name: Mutation Full / PHP 8.3
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v3.2.0
                with:
                    php-version: 8.3
                    coverage: pcov

            -   name: Full mutation suite
                run: composer test:mutation:full

            -   name: Upload mutation logs
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: infection-full
                    path: |
                        build/infection-full.log
                        build/infection-full-summary.log

    # Report-only until runner noise is measured: master stores the baseline,
    # every other run is compared with it
    benchmarks:
        if: ${{ github.event_name != 'push' }}
        continue-on-error: true
        name: Benchmarks / PHP 8.3
        runs-on: ubuntu-latest
        timeout-minutes: 20

        env:
            BASELINE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v3.2.0
                with:
                    php-version: 8.3

            -   name: Restore the master baseline
                if: ${{ env.BASELINE != 'true' }}
                uses: actions/cache/restore@v6
                with:
                    path: build/phpbench
                    key: phpbench-master-${{ github.run_id }}
                    restore-keys: phpbench-master-

            -   name: Run the benchmarks
                run: |
                    mkdir -p build
                    if [ "$BASELINE" = true ]; then
                        set -- --tag=master --store
                    elif [ -d build/phpbench ]; then
                        set -- --ref=master
                    fi
                    composer bench:ci -- "$@" 2>&1 | tee build/phpbench.txt

            -   name: Save the master baseline
                if: ${{ env.BASELINE == 'true' }}
                uses: actions/cache/save@v6
                with:
                    path: build/phpbench
                    key: phpbench-master-${{ github.run_id }}

            -   name: Summarise the benchmarks
                if: always()
                run: |
                    {
                        echo '## Benchmarks'
                        echo '```'
                        cat build/phpbench.txt
                        echo '```'
                    } >> "$GITHUB_STEP_SUMMARY"

            -   name: Upload the benchmark results
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: phpbench
                    path: build/phpbench.xml
                    if-no-files-found: warn
