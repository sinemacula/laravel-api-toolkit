name: Tests

on:
    push:
        branches: [ master ]
    pull_request:
        types: [ opened, synchronize, reopened, ready_for_review ]
    workflow_dispatch:

concurrency:
    group: tests-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    id-token: write

defaults:
    run:
        shell: bash

jobs:
    php:
        name: Test / PHP ${{ matrix.php }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: [ 8.3, 8.4, 8.5 ]

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v2.0.0
                with:
                    php-version: ${{ matrix.php }}

            -   name: PHPUnit
                run: composer test:coverage

            -   name: Publish code coverage
                if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.php == '8.3' }}
                uses: qltysh/qlty-action/coverage@357cd88be7c73c5dc45cf7cf8f99a46ec0b62b73 # v2
                with:
                    oidc: true
                    files: clover.xml

    laravel:
        name: Test / Laravel ${{ matrix.laravel.label }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                laravel:
                    -   constraint: ^13.2
                        label: 13

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v2.0.0
                with:
                    php-version: 8.3

            -   name: Pin Laravel version
                env:
                    LARAVEL_CONSTRAINT: ${{ matrix.laravel.constraint }}
                run: composer update --with="laravel/framework:${LARAVEL_CONSTRAINT}" --prefer-dist --no-interaction --no-progress

            -   name: PHPUnit
                run: composer test

    integration:
        name: Integration / ${{ matrix.database }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                include:
                    -   database: mysql
                        image: mysql:8.4
                        db_driver: mysql
                        db_port: 3306
                        db_username: root
                        db_password: password
                        health_cmd: mysqladmin ping -h 127.0.0.1
                    -   database: pgsql
                        image: postgres:17
                        db_driver: pgsql
                        db_port: 5432
                        db_username: postgres
                        db_password: password
                        health_cmd: pg_isready -h 127.0.0.1 -U postgres -d api_toolkit_test

        # Each image ignores the other's variables, so one service block serves both legs. Probes use
        # loopback because a socket probe can answer from the engine's temporary init server.
        services:
            database:
                image: ${{ matrix.image }}
                env:
                    MYSQL_ROOT_PASSWORD: password
                    MYSQL_DATABASE: api_toolkit_test
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: password
                    POSTGRES_DB: api_toolkit_test
                ports:
                    - ${{ matrix.db_port }}:${{ matrix.db_port }}
                options: >-
                    --health-cmd="${{ matrix.health_cmd }}"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
                    --health-start-period=30s
                    --health-start-interval=5s

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v2.0.0
                with:
                    php-version: 8.3
                    extensions: pdo_mysql, pdo_pgsql

            # Serial: these suites create and drop real tables in one shared database
            -   name: Database Tests
                env:
                    DB_DRIVER: ${{ matrix.db_driver }}
                    DB_HOST: 127.0.0.1
                    DB_PORT: ${{ matrix.db_port }}
                    DB_DATABASE: api_toolkit_test
                    DB_USERNAME: ${{ matrix.db_username }}
                    DB_PASSWORD: ${{ matrix.db_password }}
                run: vendor/bin/phpunit --testsuite Integration,Feature

