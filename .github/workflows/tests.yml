name: Tests

on:
    push:
        branches: [ master ]
    pull_request:
        types: [ opened, synchronize, reopened, ready_for_review ]
    schedule:
        -   cron: 0 7 * * 1
    workflow_dispatch:

# Keyed by event so a merge to master cannot cancel a scheduled or manual run
concurrency:
    group: tests-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
    cancel-in-progress: true

permissions:
    contents: read

defaults:
    run:
        shell: bash

jobs:
    php:
        name: Test / PHP ${{ matrix.php }}
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        strategy:
            fail-fast: false
            matrix:
                php: [ 8.3, 8.4, 8.5 ]

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v3.2.0
                with:
                    php-version: ${{ matrix.php }}

            -   name: PHPUnit
                run: composer test:coverage

            -   name: Benchmark smoke
                run: composer bench:smoke

            -   name: Publish code coverage
                if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.php == '8.3' }}
                uses: qltysh/qlty-action/coverage@a46e29cfd54065ae8a2c6b1fd3446aed1b1a4257 # v2
                with:
                    oidc: true
                    files: clover.xml

    lowest:
        name: Test / Lowest
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v3.2.0
                with:
                    php-version: 8.3

            # Unblocked, so a new advisory cannot move the resolved floors
            -   name: Install the lowest dependencies
                run: composer update --prefer-lowest --prefer-dist --no-blocking --no-interaction --no-progress

            -   name: Assert the declared floors resolved
                run: .github/scripts/assert-dependency-floors.sh

            -   name: PHPUnit
                run: composer test

    optional:
        name: Test / Without optional packages
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v3.2.0
                with:
                    php-version: 8.3

            -   name: Remove the optional packages
                run: |
                    packages=(laravel/octane sinemacula/laravel-resource-exporter)
                    composer remove --dev --no-interaction --no-progress "${packages[@]}"
                    for package in "${packages[@]}"; do
                        if composer show "$package" > /dev/null 2>&1; then
                            echo "::error::${package} is still installed"; exit 1
                        fi
                    done

            -   name: PHPUnit
                run: vendor/bin/paratest --exclude-group exporter --exclude-group octane

    dependencies:
        name: Package / Dependencies
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v3.2.0
                with:
                    php-version: 8.3

            -   name: Validate composer.json
                run: composer validate --strict

            -   name: Analyse dependencies
                run: vendor/bin/composer-dependency-analyser

    install:
        name: Package / Install
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v3.2.0
                with:
                    php-version: 8.3

            -   name: Build the dist archive
                run: |
                    git archive --prefix=toolkit/ HEAD | tar -x -C "$RUNNER_TEMP"
                    diff <(git ls-files src config resources) <(cd "$RUNNER_TEMP/toolkit" && find src config resources -type f | LC_ALL=C sort)

            # A path repository without symlinks installs the archive's contents under vendor/
            -   name: Install the dist archive into a Laravel application
                run: |
                    composer create-project laravel/laravel "$RUNNER_TEMP/app" --prefer-dist --no-interaction --no-progress
                    cd "$RUNNER_TEMP/app"
                    composer config repositories.toolkit '{"type": "path", "url": "../toolkit", "options": {"symlink": false, "versions": {"sinemacula/laravel-api-toolkit": "2.0.0"}}}'
                    composer require sinemacula/laravel-api-toolkit:2.0.0 --no-interaction --no-progress

            -   name: Discover the provider
                working-directory: ${{ runner.temp }}/app
                run: php artisan package:discover | grep -F sinemacula/laravel-api-toolkit

            -   name: Publish the config, translations, docs and stub
                working-directory: ${{ runner.temp }}/app
                run: |
                    php artisan vendor:publish --tag=api-toolkit-config
                    php artisan vendor:publish --tag=api-toolkit-lang
                    php artisan vendor:publish --tag=api-toolkit-docs
                    php artisan stub:publish
                    toolkit=vendor/sinemacula/laravel-api-toolkit
                    diff "$toolkit/config/api-toolkit.php" config/api-toolkit.php
                    diff -r "$toolkit/resources/lang" lang/vendor/api-toolkit
                    diff -r "$toolkit/resources/api-docs" resources/api-docs
                    diff "$toolkit/resources/stubs/api-toolkit.resource.stub" stubs/api-toolkit.resource.stub

            -   name: Route a resource
                working-directory: ${{ runner.temp }}/app
                run: |
                    sed -i 's/->withExceptions(function (Exceptions $exceptions): void {/&\n        \\SineMacula\\ApiToolkit\\Exceptions\\ApiExceptionHandler::handles($exceptions);/' bootstrap/app.php
                    grep -qF 'ApiExceptionHandler::handles($exceptions);' bootstrap/app.php
                    php artisan api-toolkit:make:resource UserResource --model=User
                    cat > app/Http/Controllers/UserController.php <<'PHP'
                    <?php

                    namespace App\Http\Controllers;

                    use App\Http\Resources\UserResource;
                    use App\Models\User;
                    use SineMacula\ApiToolkit\OpenApi\Attributes\ResponseSchema;

                    class UserController extends Controller
                    {
                        #[ResponseSchema(UserResource::class)]
                        public function show(User $user): UserResource
                        {
                            return new UserResource($user);
                        }
                    }
                    PHP
                    echo "Route::get('/users/{user}', [App\Http\Controllers\UserController::class, 'show']);" >> routes/web.php
                    php artisan db:seed --force

            -   name: Run the toolkit commands
                working-directory: ${{ runner.temp }}/app
                run: |
                    php artisan api-toolkit:validate-schemas
                    php artisan api-toolkit:export-openapi --output=openapi.json
                    jq -e '.openapi == "3.1.0" and .paths["/users/{user}"].get.responses["200"].content["application/json"].schema.properties.data["$ref"] == "#/components/schemas/User"' openapi.json
                    php artisan api-toolkit:docs:generate
                    php artisan api-toolkit:invalidate-metadata

            -   name: Cache the application
                working-directory: ${{ runner.temp }}/app
                run: |
                    php artisan config:cache
                    php artisan route:cache
                    php artisan optimize

            -   name: Request the resource
                working-directory: ${{ runner.temp }}/app
                run: |
                    php artisan serve --port=8000 > /dev/null 2>&1 &
                    request() { curl -s --retry 10 --retry-connrefused --retry-delay 1 -H 'Accept: application/json' "http://127.0.0.1:8000$1"; }
                    request /users/1 | jq -e '.data == {"_type": "user", "id": 1}'
                    request /users/0 | jq -e '.error.status == 404'

    integration:
        name: Integration / ${{ matrix.database }}${{ matrix.dependencies == 'lowest' && ' lowest' || '' }}
        runs-on: ubuntu-latest

        env:
            DB_DRIVER: ${{ matrix.db_driver }}
            DB_HOST: 127.0.0.1
            DB_PORT: ${{ matrix.db_port }}
            DB_DATABASE: api_toolkit_test
            DB_USERNAME: ${{ matrix.db_username }}
            DB_PASSWORD: ${{ matrix.db_password }}

        # The lowest legs pair the dependency floors with each engine's oldest supported version
        strategy:
            fail-fast: false
            matrix:
                database: [ mysql, pgsql ]
                dependencies: [ highest, lowest ]
                include:
                    -   database: mysql
                        image: mysql:8.4
                        db_driver: mysql
                        db_port: 3306
                        db_username: root
                        db_password: password
                        health_cmd: mysqladmin ping -h 127.0.0.1
                    -   database: pgsql
                        image: postgres:18
                        db_driver: pgsql
                        db_port: 5432
                        db_username: postgres
                        db_password: password
                        health_cmd: pg_isready -h 127.0.0.1 -U postgres -d api_toolkit_test
                    -   database: pgsql
                        dependencies: lowest
                        image: postgres:15

        # Each image ignores the other's variables, so one service block serves both legs. Probes use
        # loopback because a socket probe can answer from the engine's temporary init server.
        services:
            database:
                image: ${{ matrix.image }}
                env:
                    MYSQL_ROOT_PASSWORD: password
                    MYSQL_DATABASE: api_toolkit_test
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: password
                    POSTGRES_DB: api_toolkit_test
                ports:
                    - ${{ matrix.db_port }}:${{ matrix.db_port }}
                options: >-
                    --health-cmd="${{ matrix.health_cmd }}"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
                    --health-start-period=30s
                    --health-start-interval=5s

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v3.2.0
                with:
                    php-version: 8.3
                    extensions: pdo_mysql, pdo_pgsql

            -   name: Install the lowest dependencies
                if: matrix.dependencies == 'lowest'
                run: composer update --prefer-lowest --prefer-dist --no-blocking --no-interaction --no-progress

            -   name: Assert the declared floors resolved
                if: matrix.dependencies == 'lowest'
                run: .github/scripts/assert-dependency-floors.sh

            # Serial: these suites create and drop real tables in one shared database
            -   name: Database Tests
                run: vendor/bin/phpunit --testsuite Integration,Feature --exclude-group "$DB_DRIVER"

            -   name: Unit Database Tests
                run: vendor/bin/phpunit --testsuite Unit --group database

            # A skip here means the leg never reached its engine
            -   name: Engine Tests
                run: vendor/bin/phpunit --group "$DB_DRIVER" --fail-on-skipped

    redis:
        name: Integration / redis
        runs-on: ubuntu-latest

        env:
            REDIS_HOST: 127.0.0.1

        services:
            redis:
                image: redis:8@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
                    --health-start-period=30s
                    --health-start-interval=5s

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v3.2.0
                with:
                    php-version: 8.3
                    extensions: redis

            # A skip here means the leg never reached redis
            -   name: Redis Tests
                run: vendor/bin/phpunit --group redis --fail-on-skipped
